name: Windows offline package
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundled-review:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Preserve source bytes for cross-platform reference hashes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests -q
      - run: python scripts/build_windows_package.py --output-dir dist/windows
      - name: Extract package ZIP outside the checkout
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'PAE 검토 with spaces'
          Expand-Archive -LiteralPath 'dist/windows/Photonic-Architecture-Explorer-Windows-x64.zip' -DestinationPath $destination
          $package = Join-Path $destination 'Photonic-Architecture-Explorer-Windows-x64'
          "PAE_REVIEW_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAE_PYTHON=$package\runtime\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAE_EXPECT_ROOT=$package\app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'PYTHONPATH=' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install chromium
      - run: python scripts/validate_windows_package.py "$env:PAE_REVIEW_PACKAGE" --output-dir results/runtime-windows-package --browser-channel msedge --browser-channel chrome
      - name: Recheck extracted file inventory after use
        run: python -c "import sys; sys.path.insert(0,'scripts'); from build_windows_package import verify; verify(__import__('pathlib').Path(__import__('os').environ['PAE_REVIEW_PACKAGE'])); print('Distribution inventory remains intact')"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-offline-package
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
            dist/windows/Photonic-Architecture-Explorer-Windows-x64/PACKAGE_MANIFEST.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-evidence
          path: results/runtime-windows-package/
          if-no-files-found: warn
