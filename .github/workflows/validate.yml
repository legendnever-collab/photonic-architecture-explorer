name: Photonic physics validation
on:
  pull_request:
  push:
    branches: [main, feature/m1-two-reflector, feature/m2-bounded-diagnostics, assessment/m25-external-port, feature/m3a-external-adapter, feature/m3b-inspector]
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-evidence-python-${{ matrix.python }}
          path: results/
  inspector-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: python -m photonic_architecture_explorer.inspector
      - run: node scripts/check_inspector.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspector-browser-evidence
          path: |
            results/m3b_browser.json
            results/inspector_*.png
            results/m3b-inspector.html
            results/m4b_literature_inspector.html
            results/m4b_adapter_ci.json
  m4c-reference-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-m4c.txt
      - name: Reproduce bounded Control and verify its recorded STOP
        timeout-minutes: 2
        shell: bash
        run: |
          python scripts/run_m4c_stop.py --output-dir results/runtime/m4c-legacy
          echo 'M4-C Control acceptance: FAIL (angular-bin error). Evidence collection: PASS. Actual device performance: Uncomputed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4c-planar-reference-evidence
          path: |
            results/runtime/m4c-legacy/
            docs/M4C_*.md
            requirements-m4c.txt
      - name: Verify M4-C.1 bounded Window convergence
        timeout-minutes: 2
        run: |
          python scripts/m4c1_window_control.py --output-dir results/runtime/m4c1-window
          echo 'M4-C.1 Synthetic Window verification: PASS. Actual Field/Overlap/Total Coupling/Package: Uncomputed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4c1-window-reference-evidence
          path: |
            results/runtime/m4c1-window/
            docs/M4C1_*.md
            requirements-m4c.txt
