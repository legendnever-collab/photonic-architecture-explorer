name: Photonic physics validation
on:
  pull_request:
  push:
    branches: [main, feature/m1-two-reflector, feature/m2-bounded-diagnostics, assessment/m25-external-port, feature/m3a-external-adapter, feature/m3b-inspector]
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/validate.py
      - run: pae-design examples/m5a_two_ports.json --output-dir results/runtime-m5a-ci
      - run: python scripts/build_scenarios.py
      - name: Scenario fixtures are current
        run: git diff --exit-code -- src/photonic_architecture_explorer/scenarios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-evidence-python-${{ matrix.python }}
          path: results/
  app-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed Workspace build matches the frontend source
        run: git diff --exit-code -- src/photonic_architecture_explorer/web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_app.py --output-dir results/runtime-p1-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-workspace-browser-evidence
          path: results/runtime-p1-browser/
          if-no-files-found: error
