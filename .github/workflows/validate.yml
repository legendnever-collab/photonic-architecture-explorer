name: Photonic physics validation
on:
  pull_request:
  push:
    branches: [main, feature/m1-two-reflector, feature/m2-bounded-diagnostics, assessment/m25-external-port]
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-evidence-python-${{ matrix.python }}
          path: results/
