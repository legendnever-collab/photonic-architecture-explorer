[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonic-architecture-explorer"
version = "0.1.0"
description = "Synthetic two-reflector paraxial feasibility and independent validation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["numpy>=2,<3"]

[project.scripts]
pae-benchmark = "photonic_architecture_explorer.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
