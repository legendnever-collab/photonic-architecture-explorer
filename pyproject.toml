[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonic-architecture-explorer"
version = "0.2.0"
description = "Two fixed optical Ports in, physics-checked interconnect concepts out"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[project.optional-dependencies]
test = ["numpy>=2,<3"]

[project.scripts]
pae-app = "photonic_architecture_explorer.app:main"
pae-design = "photonic_architecture_explorer.design:main"
pae-external = "photonic_architecture_explorer.external:main"
pae-benchmark = "photonic_architecture_explorer.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photonic_architecture_explorer = ["data/m7r1_mode_references.json", "scenarios/*.json", "web/*", "web/**/*"]
